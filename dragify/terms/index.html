<html lang="en">

  <title>Redirecting to Dragify's Terms of Service…</title>
  <link rel="canonical" href="https://dragifyapp.com/terms/">

  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F3EC; color: #14181D; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: #14181D; }
  </style>
  <script>location.replace("https://dragifyapp.com/terms/");</script>
</head>
<body>
